name: Deploy ECR Repo

on:
  workflow_dispatch:
      inputs:
        environment:
          required: true
          default: 'dev'
          type: string
        service:
          required: true
          type: string
# Required when using OIDC (role-to-assume) with AWS
permissions:
  id-token: write
  contents: read

jobs:
  deploy-ecr-template:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout-code
        uses: actions/checkout@v4
      
      - name: configure aws creds
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          audience: ${{ secrets.AUDIENCE }}
          aws-region: ${{ vars.REGION }}
          role-to-assume: ${{ secrets.ASSUMEROLE }}
      
      - name: Deploying Cloudformation Template
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SERVICE: ${{ inputs.service }}
        run: |
          aws cloudformation deploy \
            --template-file ./aws/iac/ecr/ecr.yaml \
            --stack-name "$ENVIRONMENT-$SERVICE-ecr" \
            --parameter-overrides \
                environment="$ENVIRONMENT" \
                service="$SERVICE" \
            --capabilities CAPABILITY_NAMED_IAM