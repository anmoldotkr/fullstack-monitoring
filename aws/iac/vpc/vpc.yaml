AWSTemplateFormatVersion: '2010-09-09'
Description: "Template to create VPC, Subnets, Route Table Associations, and export them"
Parameters:
  environment:
    Type: String
    Default: dev
    Description: "The environment name (e.g., dev, test, prod)"
  service:
    Type: String
    Default: vpc
    Description: "The service or component name associated with the resources"

Resources:
  testVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${environment}-${service}-VPC"

  testInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${environment}-${service}-IGW"

  attachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref testVpc
      InternetGatewayId: !Ref testInternetGateway

  testPubliceSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref testVpc
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: !Sub "${environment}-${service}-PublicSubnet1"

  testPubliceSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref testVpc
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select
        - 1
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: !Sub "${environment}-${service}-PublicSubnet2"

  testNatIP:
    Type: AWS::EC2::EIP
    DependsOn: attachGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${environment}-${service}-NatEIP"

  testNatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: attachGateway
    Properties:
      AllocationId: !GetAtt testNatIP.AllocationId
      SubnetId: !Ref testPubliceSubnet1
      Tags:
        - Key: Name
          Value: !Sub "${environment}-${service}-NatGW"

  testPrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref testVpc
      CidrBlock: 10.0.3.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: !Sub "${environment}-${service}-PrivateSubnet1"

  testPrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref testVpc
      CidrBlock: 10.0.4.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select
        - 1
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: !Sub "${environment}-${service}-PrivateSubnet2"

  testPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref testVpc
      Tags:
        - Key: Name
          Value: !Sub "${environment}-${service}-PublicRouteTable"

  testPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: attachGateway
    Properties:
      RouteTableId: !Ref testPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref testInternetGateway

  subnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref testPubliceSubnet1
      RouteTableId: !Ref testPublicRouteTable

  subnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref testPubliceSubnet2
      RouteTableId: !Ref testPublicRouteTable

  privateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref testVpc
      Tags:
        - Key: Name
          Value: !Sub "${environment}-${service}-PrivateRouteTable"

  privateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref privateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref testNatGateway

  privateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref testPrivateSubnet1
      RouteTableId: !Ref privateRouteTable

  privateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref testPrivateSubnet2
      RouteTableId: !Ref privateRouteTable
Outputs:
  VPCId:
    Description: VPC ID
    Value: !Ref testVpc
    Export:
      Name: !Sub "${environment}-${service}-VpcId"
  testPubliceSubnet1ID:
    Description: Public Subnet 1 ID
    Value: !Ref testPubliceSubnet1
    Export:
      Name: !Sub "${environment}-${service}-Subnet1Id"
  testPubliceSubnet2ID:
    Description: Public Subnet 2 ID
    Value: !Ref testPubliceSubnet2
    Export:
      Name: !Sub "${environment}-${service}-Subnet2Id"
  testPrivateSubnet1ID:
    Description: Private Subnet 1 ID
    Value: !Ref testPrivateSubnet1
    Export:
      Name: !Sub "${environment}-${service}-PrivateSubnet1Id"
  testPrivateSubnet2ID:
    Description: Private Subnet 2 ID
    Value: !Ref testPrivateSubnet2
    Export:
      Name: !Sub "${environment}-${service}-PrivateSubnet2Id"